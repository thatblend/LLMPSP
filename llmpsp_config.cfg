# LLMPSP configuration. One "key = value" per line, '#' starts a comment.
# Missing keys use the defaults shown here. Every value is clamped to a
# safe range, so a bad edit degrades instead of crashing.

# Weight cache RAM target in MiB (0-46). More cache = fewer memory-stick
# reads per token. 0 disables all caching AND the volatile extension:
# the minimum-memory mode for troubleshooting startup crashes.
cache_mb = 44

# CPU clock 100-333 MHz (the bus runs at half). Lower saves battery.
cpu_mhz = 333

# 1 = borrow the firmware's spare 4 MiB (volatile memory) as extra weight
# cache. Set 0 if quitting to the XMB misbehaves on your firmware.
volatile_mem = 1

# Experimental: 1 = asynchronous background reads of streamed weights
# (with stripe = 1 to spread them across layers). Measured on a
# PSP-2000: the memory-stick driver does its work on the CPU, so this
# gave no speedup and the scattered reads made it SLOWER. Leave 0
# unless you want to re-test on different hardware.
prefetch = 0
stripe = 0

# Conversation context in tokens (128-512). Smaller frees RAM for more
# weight cache (fewer card reads per token, so faster) but the chat must
# be restarted sooner. 256 is the recommended speed setting for short
# chats; 512 allows the longest conversations.
context = 512

# Sampling. temperature 0 gives deterministic greedy replies; try 0.7
# together with the defaults below for more varied answers.
temperature = 0
top_p = 0.9
top_k = 32
repetition_penalty = 1.08

# Longest single reply in tokens (8-256). Longer replies take longer.
max_reply_tokens = 128
