# LLMPSP configuration. One "key = value" per line, '#' starts a comment.
# Missing keys use the defaults shown here. Every value is clamped to a
# safe range, so a bad edit degrades instead of crashing.

# Weight cache RAM target in MiB (0-46). More cache = fewer memory-stick
# reads per token. 0 disables all caching AND the volatile extension:
# the minimum-memory mode for troubleshooting startup crashes.
cache_mb = 44

# 1 = borrow the firmware's spare 4 MiB (volatile memory) as extra weight
# cache. Set 0 if quitting to the XMB misbehaves on your firmware.
volatile_mem = 1

# Experimental: 1 = asynchronous background reads of streamed weights
# (with stripe = 1 to spread them across layers). Measured on a
# PSP-2000: the memory-stick driver does its work on the CPU, so this
# gave no speedup and the scattered reads made it SLOWER. Leave 0
# unless you want to re-test on different hardware.
prefetch = 0
stripe = 0

# Up to 1024 works: each extra token costs about 6.5 KiB of RAM, so at
# 1024 roughly 3 MiB of weights no longer fit and are read from the
# memory stick every token. Still correct, just slower (and long chats
# slow down anyway as the context fills).
# Conversation context in tokens (128-1024, default 384). At 384 a
# PSP-2000/3000 should hold the whole model in RAM; larger values leave
# some weights on the memory stick (slower per token, see fit below),
# smaller ones only make the chat restart sooner. If the console
# does not have the RAM for the value set here, the app starts with the
# largest context that fits (down to 128) and notes it in
# llmpsp_trace.txt.
context = 384

# 1 = if a few weight blocks do not fit in RAM at this context, give up
# the fewest tokens of context (at most a quarter) that let the whole
# model stay in RAM, so nothing streams from the memory stick. 0 = always
# keep the context above and stream what does not fit. The trace logs
# "[stage] fit: context requested N, granted M" and why.
fit = 1

# 1 = keep the Mamba recurrent state as float16 (2.25 MiB less RAM, which
# is what lets the whole model fit; replies can differ slightly from the
# float32 state). 0 = float32 state, as in v1.3.
state_f16 = 1

# Sampling. temperature 0 gives the same reply every time (greedy).
# 0.3 keeps replies coherent but less repetitive; above about 0.7 this
# small model starts to ramble.
temperature = 0.3
top_p = 0.9
top_k = 32
repetition_penalty = 1.08

# Longest single reply in tokens (8-1024). A reply also stops when the
# context is full, so 384 means "until the model finishes or the
# conversation is full". Circle stops a reply at any time.
max_reply_tokens = 384

# On-screen keyboard: abc (alphabetical) or qwerty (PC-style letter rows
# with the symbols around them).
keyboard = abc
